name: Bug 反馈
description: 崩溃、显示异常、导入失败等问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有相同 Issue。
        **请勿粘贴 API Key、完整对话内容等隐私信息。**
  - type: input
    id: device
    attributes:
      label: 手机型号与系统版本
      placeholder: 例如：小米 14 / Android 15
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: 应用版本
      placeholder: 例如：1.0.0（我的 → 关于与开源）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图或日志
      description: 可以直接拖拽图片；日志请去掉 API Key。
